<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Goat Sandbox</title>
<style>
:root{--hud:rgba(255,248,230,.92);--ink:#3a2418;--pop:#ff5a36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hud:rgba(40,28,20,.92);--ink:#ffe9c9;--pop:#ff8a4a}}
:root[data-theme="dark"]{--hud:rgba(40,28,20,.92);--ink:#ffe9c9;--pop:#ff8a4a}
html,body{height:100%;margin:0;overflow:hidden;background:#a9d3f0;font-family:"Trebuchet MS",Verdana,sans-serif}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;background:var(--hud);color:var(--ink);padding:10px 14px;border-radius:14px;font-weight:700;font-size:14px;line-height:1.4}
#score{font-size:28px;display:block}
#keys{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--hud);color:var(--ink);padding:10px 14px;border-radius:14px;font-size:13px;font-weight:700;line-height:1.9;max-width:260px}
#keys h4{margin:0 0 4px;font-size:14px}
#keys div{display:flex;justify-content:space-between;gap:16px;align-items:center}
#keys span{font-weight:400;text-align:right}
kbd{display:inline-block;min-width:18px;padding:0 6px;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;font-size:12px;font-weight:700;line-height:1.3;text-align:center;margin-left:3px}
#msg{position:fixed;top:28%;left:0;right:0;text-align:center;font-size:clamp(28px,6vw,56px);font-weight:900;color:var(--pop);text-shadow:0 3px 0 #fff,0 6px 12px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .4s}
</style></head><body>
<div id="hud"><span id="score">0</span></div>
<div id="keys"><h4>Controls</h4>
<div><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>Move</span></div>

<div><span><kbd>Q</kbd><kbd>E</kbd> / drag</span><span>Look around</span></div>
<div><span><kbd>1</kbd></span><span>Bleat</span></div>

<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=Math.random,PI=Math.PI,rr=(a,b)=>a+R()*(b-a),pick=a=>a[Math.floor(R()*a.length)];
const scene=new THREE.Scene();
{const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d'),gr=x.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#4a86d8');gr.addColorStop(.6,'#a9d3f0');gr.addColorStop(1,'#e4eef0');x.fillStyle=gr;x.fillRect(0,0,2,256);scene.background=new THREE.CanvasTexture(c)}
scene.fog=new THREE.Fog(0xdbe9ee,70,260);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.5,480);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;ren.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x5a6a40,.75));
const sun=new THREE.DirectionalLight(0xfff0d6,1.1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,near:1,far:160});sun.shadow.bias=-.0004;scene.add(sun,sun.target);

const mt=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const bx=(w,h,d,m,x=0,y=0,z=0,par)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;if(par)par.add(o);return o};
const tex=(w,h,fn,rx=1,ry=1)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t};
const speck=(x,w,h,cols,n)=>{for(let i=0;i<n;i++){x.fillStyle=pick(cols);x.fillRect(R()*w,R()*h,2,2)}};
const fl=(m,x,y,z,w,d,rot)=>{const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);o.rotation.x=-PI/2;o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);return o};

// ---------- world ----------
const grass=tex(256,256,x=>{x.fillStyle='#5d9a43';x.fillRect(0,0,256,256);speck(x,256,256,['#4f8a38','#6aa84d','#76b256','#488032'],2500)},170,170);
fl(new THREE.MeshStandardMaterial({map:grass,roughness:1}),0,0,0,1000,1000);
const conc=new THREE.MeshStandardMaterial({map:tex(128,128,x=>{x.fillStyle='#a3a29c';x.fillRect(0,0,128,128);speck(x,128,128,['#96958f','#b0afa9','#8c8b86'],700);x.strokeStyle='#85847f';x.strokeRect(0,0,64,64);x.strokeRect(64,64,64,64)},7,7),roughness:.95});
const roadM=new THREE.MeshStandardMaterial({map:tex(128,128,x=>{x.fillStyle='#3a3c41';x.fillRect(0,0,128,128);speck(x,128,128,['#2f3136','#45474c','#505257'],900);x.fillStyle='#e6dca0';x.fillRect(62,8,4,48);x.fillStyle='#b8b8b8';x.fillRect(5,0,2,128);x.fillRect(121,0,2,128)},1,370/14),roughness:.9});
const asph=mt(0x3a3c41,.9);
const cwM=new THREE.MeshStandardMaterial({map:tex(128,128,x=>{x.fillStyle='#e4e4e0';const p=128/14,c=64;for(let i=0;i<6;i++){const o=(-4.4+i*1.76)*p+c;x.fillRect(o,c+5.2*p,.9*p,1.7*p);x.fillRect(o,c-6.9*p,.9*p,1.7*p);x.fillRect(c+5.2*p,o,1.7*p,.9*p);x.fillRect(c-6.9*p,o,1.7*p,.9*p)}}),transparent:true,depthWrite:false,roughness:.9});
for(let k=-3;k<=3;k++){
  const v=fl(roadM,60*k,.04,0,10,370);const h=fl(roadM,0,.04,60*k,10,370);h.rotation.set(-PI/2,0,0);h.rotation.order='YXZ';h.rotation.y=PI/2;
  for(let j=-3;j<=3;j++){fl(asph,60*k,.06,60*j,10.2,10.2);fl(cwM,60*k,.07,60*j,14,14)}
}
const houses=[],trees=[],pads=[],props=[],people=[];
const gh=(x,z)=>{let m=0;for(const o of houses)if(Math.abs(x-o.x)<o.w+.3&&Math.abs(z-o.z)<o.d+.3)m=Math.max(m,o.h);return m};
const inH=(x,z,p)=>houses.some(o=>Math.abs(x-o.x)<o.w+p&&Math.abs(z-o.z)<o.d+p);
function collide(p,v,rad){
  for(const o of houses){if(p.y>=o.h-.3)continue;
    const px=Math.max(o.x-o.w,Math.min(p.x,o.x+o.w)),pz=Math.max(o.z-o.d,Math.min(p.z,o.z+o.d));
    let dx=p.x-px,dz=p.z-pz,d=Math.hypot(dx,dz);
    if(d<rad){
      if(d<1e-4){const ex=o.w-Math.abs(p.x-o.x),ez=o.d-Math.abs(p.z-o.z);if(ex<ez){dx=Math.sign(p.x-o.x)||1;dz=0;d=-ex}else{dz=Math.sign(p.z-o.z)||1;dx=0;d=-ez}}
      else{dx/=d;dz/=d}
      const pen=rad-d;p.x+=dx*pen;p.z+=dz*pen;const vn=v.x*dx+v.z*dz;if(vn<0){v.x-=1.5*vn*dx;v.z-=1.5*vn*dz}
    }}
}
const wtex=c=>tex(128,128,x=>{x.fillStyle=c;x.fillRect(0,0,128,128);for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=R()<.3?'#ffe6a0':'#3d5a78';x.fillRect(i*32+6,j*32+7,20,18);x.fillStyle='rgba(255,255,255,.18)';x.fillRect(i*32+6,j*32+7,20,5)}});
const wins=['#d9c7a8','#b8c4cc','#c9a58f','#a9b79c','#8f99a8'].map(wtex);
function building(x,z,w,d,h){
  const b=pick(wins),tx=b.clone(),tz=b.clone();tx.needsUpdate=tz.needsUpdate=true;tx.repeat.set(d/8,h/12);tz.repeat.set(w/8,h/12);
  const mx=new THREE.MeshStandardMaterial({map:tx,roughness:.7}),mz=new THREE.MeshStandardMaterial({map:tz,roughness:.7}),rf=mt(0x575c60);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mx,mx,rf,rf,mz,mz]);m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);
  bx(w*.3,2.5,d*.3,mt(0x888b8e),x+w*.1,h+1.25,z-d*.1,scene);houses.push({x,z,w:w/2,d:d/2,h});
  const ac=pick([0xc0392b,0x2e86ab,0x3f8f4f,0xe0a030]);
  [1,-1].forEach(s=>{const ox=rr(-w/3,w/3);bx(2.4,3.2,.3,mt(0x2a2420),x+ox,1.6,z+s*d/2,scene);bx(4,.3,1.6,mt(ac),x+ox,3.5,z+s*(d/2+.7),scene);bx(2,.6,.1,mt(0xfff2c0,.3),x+ox,4.2,z+s*(d/2+.06),scene)});
  if(h>20){const tk=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,2.2,12),mt(0x8a5a3a));tk.position.set(x-w*.25,h+1.1,z+d*.2);tk.castShadow=true;scene.add(tk)}
}
const fol=[0x3f7d3a,0x4d8f43,0x376b34,0x5a9a48].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.9,flatShading:true})),bark=mt(0x6b4a2f);
const trunkG=new THREE.CylinderGeometry(.22,.3,2.6,8),ico=new THREE.IcosahedronGeometry(1,1);
function tree(x,z){
  const s=rr(.8,1.5),t=new THREE.Mesh(trunkG,bark);t.scale.set(s,s,s);t.position.set(x,1.3*s,z);t.castShadow=true;scene.add(t);
  const m=pick(fol);[[1.7,3.3],[1.2,4.5]].forEach(([r,y])=>{const f=new THREE.Mesh(ico,m);f.scale.setScalar(r*s);f.position.set(x,y*s,z);f.castShadow=true;scene.add(f)});
  trees.push({x,z});
}
function tramp(x,z){const o=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,.4,24),mt(0xff5fa8,.5));o.position.set(x,.25,z);o.castShadow=o.receiveShadow=true;scene.add(o);
  const r=new THREE.Mesh(new THREE.TorusGeometry(2.3,.12,8,24),mt(0x2a2a30));r.rotation.x=PI/2;r.position.set(x,.45,z);scene.add(r);pads.push({x,z})}
tramp(0,-22);
function genWorld(){for(let i=-3;i<3;i++)for(let j=-3;j<3;j++){
  const cx=60*i+30,cz=60*j+30,dist=Math.hypot(cx,cz),t=R();
  if(t<.22){ // park
    const pn=new THREE.Mesh(new THREE.CylinderGeometry(6,6,.1,28),new THREE.MeshStandardMaterial({color:0x3d7fa8,roughness:.2}));pn.position.set(cx+rr(-8,8),.08,cz+rr(-8,8));scene.add(pn);
    for(let n=0;n<9;n++){const x=cx+rr(-17,17),z=cz+rr(-17,17);if(Math.hypot(x-pn.position.x,z-pn.position.z)>8)tree(x,z)}
    for(let n=0;n<3;n++)spawn(4,cx+rr(-12,12),cz+rr(-12,12),R()*PI);
    fl(conc,cx,.05,cz,4,44);fl(conc,cx,.05,cz,44,4);
    const fg=new THREE.SphereGeometry(.18,6,5);for(let n=0;n<40;n++){const f=new THREE.Mesh(fg,mt(pick([0xff5a8a,0xffd23a,0xffffff,0xb066ff])));f.position.set(cx+rr(-20,20),.2,cz+rr(-20,20));scene.add(f)}
    if(R()<.6)tramp(cx+rr(-10,10),cz+rr(10,16));
  }else{
    fl(conc,cx,.03,cz,44,44);
    if(t<.3){for(let n=0;n<12;n++)spawn(pick([0,1,2,5]),cx+rr(-18,18),cz+rr(-18,18),R()*PI);tramp(cx-8,cz);
      const fx=cx+8;houses.push({x:fx,z:cz,w:3,d:3,h:.7});const bs=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,.7,24),mt(0x9a9a94));bs.position.set(fx,.35,cz);bs.castShadow=bs.receiveShadow=true;scene.add(bs);
      const wt=new THREE.Mesh(new THREE.CylinderGeometry(2.8,2.8,.1,24),new THREE.MeshStandardMaterial({color:0x4aa3d8,roughness:.1}));wt.position.set(fx,.68,cz);scene.add(wt);
      const sp2=new THREE.Mesh(new THREE.CylinderGeometry(.2,.35,1.8,10),mt(0x9a9a94));sp2.position.set(fx,1.2,cz);scene.add(sp2)}
    else{const tall=Math.max(0,(140-dist)/140),H=()=>rr(8,18)+tall*rr(0,38);
      if(R()<.55)building(cx,cz,rr(24,36),rr(24,36),H());
      else{building(cx-11,cz,rr(14,18),rr(26,36),H());building(cx+11,cz,rr(14,18),rr(26,36),H())}}
  }
}}
for(let n=0;n<90;n++){const a=R()*PI*2,r=rr(200,235);tree(Math.cos(a)*r,Math.sin(a)*r)}
const lampG=new THREE.CylinderGeometry(.08,.1,6,6),lampM=mt(0x333840);
for(let k=-3;k<=3;k++)for(let t=-180;t<=180;t+=40){[[60*k+5.4,t],[t,60*k+5.4]].forEach(([x,z])=>{
  const p=new THREE.Mesh(lampG,lampM);p.position.set(x,3,z);scene.add(p);const h=new THREE.Mesh(new THREE.BoxGeometry(.5,.15,.3),mt(0xfff2c0,.3));h.position.set(x,6,z);scene.add(h)})}

const clouds=[],cloudM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.92,fog:false});
for(let n=0;n<16;n++){const c=new THREE.Group();for(let i=0;i<4;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(rr(9,16),10,8),cloudM);s.scale.y=.45;s.position.set(i*10-15,rr(-2,2),rr(-5,5));c.add(s)}c.position.set(rr(-300,300),rr(90,130),rr(-300,300));scene.add(c);clouds.push(c)}
// ---------- props ----------
const carCols=[0xc0392b,0x2e6fb5,0xe0b030,0xdddddd,0x2a2d33,0x3f8f4f];
const kinds=[
 {mk:()=>bx(1,1,1,mt(0xa87942)),r:.8,h:.5,t:1,mass:1,pts:10},
 {mk:()=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,1.2,14),mt(pick([0x2f6fb5,0xb5382f,0x3f8f4f]),.5));o.castShadow=true;return o},r:.6,h:.6,t:1.2,mass:1.3,pts:15},
 {mk:()=>{const o=new THREE.Mesh(new THREE.ConeGeometry(.45,1,12),mt(0xff7a1a,.6));o.castShadow=true;return o},r:.5,h:.5,t:1,mass:.5,pts:5},
 {mk:()=>{const g=new THREE.Group(),c=mt(pick(carCols),.35);bx(1.9,.55,4.2,c,0,-.15,0,g);bx(1.6,.55,2.2,c,0,.4,-.2,g);bx(1.64,.4,2,mt(0x9ec3d6,.1),0,.42,-.2,g);
   [[.95,1.3],[-.95,1.3],[.95,-1.3],[-.95,-1.3]].forEach(([x,z])=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.25,12),mt(0x18181a));w.rotation.z=PI/2;w.position.set(x,-.35,z);w.castShadow=true;g.add(w)});return g},r:2.1,h:.7,t:1.5,mass:4,pts:50},
 {mk:()=>{const g=new THREE.Group(),w=mt(0x8b5a2b);bx(1.8,.1,.5,w,0,0,0,g);bx(1.8,.45,.08,w,0,.3,-.25,g);bx(.1,.5,.4,mt(0x333),.8,-.25,0,g);bx(.1,.5,.4,mt(0x333),-.8,-.25,0,g);return g},r:1.1,h:.5,t:1,mass:1.5,pts:15},
 {mk:()=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(.35,.3,.9,10),mt(0x2f5a3a));o.castShadow=true;return o},r:.45,h:.45,t:.9,mass:.6,pts:8}
];
function spawn(i,x,z,ry){const k=kinds[i],m=k.mk();m.position.set(x,k.h,z);m.rotation.y=ry;scene.add(m);props.push({m,k,v:new THREE.Vector3(),w:new THREE.Vector3(),cd:0})}
const sw=(o)=>{const a=R()<.5,k=Math.floor(rr(-3,4)),off=(R()<.5?-1:1)*o,t=rr(-180,180);return a?{x:60*k+off,z:t,a:1}:{x:t,z:60*k+off,a:0}};
for(let n=0;n<48;n++){let p;do p=sw(2.6);while(Math.hypot(p.x,p.z)<14);spawn(3,p.x,p.z,p.a?(p.x%60>0?0:PI):(p.z%60>0?PI/2:-PI/2))}
for(let n=0;n<110;n++){const p=sw(rr(3,6.5));if(Math.hypot(p.x,p.z)>8)spawn(pick([0,0,1,2,2,5]),p.x,p.z,R()*PI)}

genWorld();
// ---------- people ----------
const legG=new THREE.CylinderGeometry(.09,.08,.85,8).translate(0,-.425,0),armG=new THREE.CylinderGeometry(.05,.045,.58,8).translate(0,-.29,0),
 torG=new THREE.CylinderGeometry(.2,.17,.62,10),hdG=new THREE.SphereGeometry(.13,12,10),hrG=new THREE.SphereGeometry(.14,10,8,0,PI*2,0,PI/2),shG=new THREE.BoxGeometry(.12,.07,.26);
function person(){
  const g=new THREE.Group();g.rotation.order='YXZ';
  const skin=mt(pick([0xf1c9a5,0xd9a37a,0xa8714b,0x6e4528,0xe8b894]),.7),shirt=mt(new THREE.Color().setHSL(R(),.55,.5)),pants=mt(pick([0x2b3a55,0x3a3a3a,0x6b5a3a,0x4a5a6a])),shoe=mt(0x1c1c1c),hair=mt(pick([0x201510,0x4a2e1a,0xb08a50,0x888888,0x111]));
  const part=(geo,m,x,y,z,par=g)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;par.add(o);return o};
  const legs=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*.1,.88,0);g.add(p);part(legG,pants,0,0,0,p);part(shG,shoe,0,-.85,.05,p);return p});
  const arms=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*.27,1.46,0);g.add(p);part(armG,shirt,0,0,0,p);part(new THREE.SphereGeometry(.05,6,6),skin,0,-.6,0,p);return p});
  part(torG,shirt,0,1.17,0);part(hdG,skin,0,1.68,0);part(hrG,hair,0,1.7,-.01);
  const eg=new THREE.SphereGeometry(.018,6,5),ey=mt(0x111);[-1,1].forEach(s=>part(eg,ey,s*.05,1.7,.12));part(new THREE.SphereGeometry(.02,6,5),skin,0,1.67,.135);
  if(R()<.35)part(new THREE.CylinderGeometry(.12,.28,.4,10),pants,0,.82,0);
  if(R()<.4)part(new THREE.BoxGeometry(.3,.4,.14),mt(pick([0xc0392b,0x2e6fb5,0x333])),0,1.2,-.2);
  const ht=R();if(ht<.2){part(new THREE.CylinderGeometry(.15,.15,.09,12),shirt,0,1.79,0);part(new THREE.CylinderGeometry(.22,.22,.02,12),shirt,0,1.75,.02)}else if(ht<.35)part(new THREE.SphereGeometry(.145,10,8,0,PI*2,0,PI/2),mt(pick([0xe0a030,0x2e86ab])),0,1.72,0);
  g.scale.setScalar(rr(.92,1.08));
  scene.add(g);return {g,legs,arms}
}
for(let n=0;n<60;n++){const q=person(),s=sw(6.5);Object.assign(q,{x:s.x,z:s.z,y:0,axis:s.a,tc:rr(-185,185),v:{x:0,z:0},vy:0,spin:0,state:'walk',t:0,ph:R()*6});people.push(q)}

// ---------- goat ----------
const g=new THREE.Group(),rot=new THREE.Group();rot.position.y=.95;g.add(rot);scene.add(g);
const fur=new THREE.MeshStandardMaterial({color:0xdcc19a,roughness:.95}),dk=mt(0x5a3c28,.8),hornM=mt(0xe8dcc0,.55);
const sph=(m,sx,sy,sz,x,y,z,par)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),m);o.scale.set(sx,sy,sz);o.position.set(x,y,z);o.castShadow=true;par.add(o);return o};
const A=(x,y,z)=>({x,y:y-.95,z});
